about: Pham Minh Duc is an AI researcher with a Bachelor’s degree in Computer and Information Science from VNU University of Science. His research interests center on computer vision and deep learning, 
      with a particular focus on developing and optimizing models for high accuracy and efficiency. He has published and contributed to ongoing research presented at international conferences. 
      His current work aims to advance computer vision methods for real-world challenges, especially in healthcare and intelligent systems.

